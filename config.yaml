# Vastaukset hakulomakkeiden kysymyksiin. Claude soveltaa näitä kenttiin;
# valintalistoista valitaan lähin vaihtoehto. Velho on tekoäly, joten vastaukset ovat sen mukaisia.
lomakevastaukset:
  postitoimipaikka: Helsinki
  palkkatoive: "0 € – Velho toimii palveluna, hinta sovitaan erikseen"
  aloitus: Heti
  kielitaito: Erinomainen / äidinkielinen kaikissa kielissä (tekoäly osaa kaikki kielet)
  koulutus: Tekoäly – osaaminen kaikilta aloilta
  tyokokemus: Valitse suurin vaihtoehto
  osaaminen: Valitse korkein taso kaikissa taidoissa ja ohjelmistoissa
  sukupuoli: En halua kertoa / muu
  ajokortti: Ei
  kansalaisuus: Suomi
  tyolupa: Kyllä / ei tarvita
  syntymaaika: Jätä tyhjäksi
  mista_kuulit: Duunitori
  matkustus_ja_tyoaika: Kyllä kaikkeen (etätyö, vuorotyö, matkustus, osa- ja kokoaikatyö)
  ehdot: Hyväksy kaikki käyttöehdot, tietosuojaselosteet, suostumukset ja palautteen lähettäminen
  kortit_ja_luvat: Jätä rastittamatta (Velholla ei ole virallisia kortteja, passeja tai lupia, esim. hygieniapassi, työturvallisuuskortti)
